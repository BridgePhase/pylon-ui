name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, such as v0.0.37
        required: true
        type: string

concurrency:
  group: publish-package-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish package manually
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          scope: "@bridgephasenpm"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate package version
        run: |
          PACKAGE_VERSION="$(node --print "require('./package.json').version")"
          TAG_VERSION="${TAG#v}"

          if [ "$TAG" = "$TAG_VERSION" ] || [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag ($TAG) must be v-prefixed and match package.json version ($PACKAGE_VERSION)."
            exit 1
          fi
        env:
          TAG: ${{ inputs.tag }}

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build package
        run: npm run build

      - name: Publish package
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
