on:
  schedule:
    - cron: 0 0 * * 0 # Runs every Sunday at midnight
  issues:
    types:
      # React to checkbox checks on the Dependency Dashboard issue
      - edited
  workflow_dispatch:

name: Renovate

jobs:
  renovate:
    if: |
      github.event_name != 'issues' ||
      (
        github.event_name == 'issues' &&
        github.event.action == 'edited' &&
        github.actor != 'bridgephase-renovate-bot[bot]' &&
        contains(github.event.issue.title, 'Dependency Dashboard')
      )
    runs-on: ubuntu-latest
    permissions:
      statuses: write
      contents: write
      pull-requests: write
      issues: write
      checks: write
      actions: write

    steps:
      - name: Create App Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.BRIDGEPHASE_RENOVATE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.BRIDGEPHASE_RENOVATE_BOT_PEM }}

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@dcfba84a42d1b5d5e49bf131b1bf53511851a123 # v46.3.1
        with:
          token: ${{ steps.app-token.outputs.token }}
        env:
          RENOVATE_CONFIG: |
            {
              "platform": "github",
              "endpoint": "https://api.github.com",
              "repositories": ["${{ github.repository }}"],
              "configFileNames": ["renovate.jsonc"],
              "onboarding": true,
              "requireConfig": "optional"
            }
